plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.dleanjeans.recupero'
version = '1.0.0'

android {
  namespace "expo.modules.appusage"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // AppOpenWatcher posts app-open reminders through expo-notifications so their buttons reach the JS task.
  implementation project(':expo-notifications')
}
