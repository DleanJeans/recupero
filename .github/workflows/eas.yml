name: EAS

on:
  push:
    branches: ["**"]
  pull_request:
    types: labeled
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to build
        type: choice
        options: [development, preview, production]
        default: development

permissions:
  contents: write
  pull-requests: write

jobs:
  eas:
    uses: DleanJeans/expo-workflows/.github/workflows/eas.yml@main
    with:
      app-name: recupero-dev
      expo-project-slug: recupero
      ota-label: send ota
      profile: ${{ inputs.profile || '' }}
      # Build these APKs on push whenever the native fingerprint changes (no build-apk keyword needed).
      auto-build-profiles: development,preview
    secrets:
      expo-token: ${{ secrets.EXPO_TOKEN }}
      ntfy-topic: ${{ secrets.NTFY_TOPIC }}
